<svg fill="none" viewBox="0 0 1200 420" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="subTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .grid-line { stroke: #3b82f6; stroke-opacity: 0.08; stroke-width: 1; }
    .floating-orb1 {
      animation: floatOrb1 14s ease-in-out infinite alternate;
    }
    .floating-orb2 {
      animation: floatOrb2 18s ease-in-out infinite alternate;
    }
    .pulse-node {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .particle {
      animation: flowAcross 10s linear infinite;
    }
    .badge-card {
      transition: all 0.3s ease;
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(120px, 40px) scale(1.2); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1.1); }
      100% { transform: translate(-100px, -50px) scale(0.9); }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.3; transform: scale(0.98); }
      50% { opacity: 0.8; transform: scale(1.02); }
    }
    @keyframes flowAcross {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Background Glowing Orbs (Behind everything) -->
  <g filter="url(#glow)">
    <circle class="floating-orb1" cx="200" cy="100" r="140" fill="#3b82f6" fill-opacity="0.22" />
    <circle class="floating-orb2" cx="1020" cy="300" r="160" fill="#8b5cf6" fill-opacity="0.2" />
    <circle class="floating-orb1" cx="600" cy="380" r="110" fill="#ec4899" fill-opacity="0.15" />
  </g>

  <!-- Cyber Grid Pattern (Subtle Background) -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Animated Data Circuit Lines (Subtle in Background) -->
  <g stroke-linecap="round" fill="none">
    <path d="M 80,360 L 260,360 L 320,390 L 520,390" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="10 15" class="particle" />
    <path d="M 680,390 L 880,390 L 940,360 L 1120,360" stroke="#a855f7" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="10 15" class="particle" />
  </g>

  <!-- Foreground Content: Header Tag / Pill -->
  <g transform="translate(600, 52)">
    <rect x="-175" y="0" width="350" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1.5" />
    <circle cx="-150" cy="17" r="5" fill="#10b981">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#93c5fd" text-anchor="middle" letter-spacing="1">
      ⚡ ENTERPRISE CLOUD OFFICE &amp; OFFBOARDING
    </text>
  </g>

  <!-- Foreground Title: Crisp, High-Contrast & Centered -->
  <text x="600" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" text-anchor="middle" letter-spacing="-0.5">
    Awesome Cloud Office &amp; Offboarding
  </text>

  <!-- Foreground Subtitle -->
  <text x="600" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#e2e8f0" text-anchor="middle">
    Inactive User Detection • Mailbox Archiving • Data Retention • Identity Lifecycle (JML)
  </text>

  <text x="600" y="230" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#94a3b8" text-anchor="middle">
    Curated Hub of Market-Leading SaaS Suites &amp; Production-Ready Open-Source Tools
  </text>

  <!-- Dynamic Feature Badges / Cards at the bottom (Clear of text) -->
  <g transform="translate(100, 280)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="220" height="72" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#0284c7" fill-opacity="0.2" />
      <text x="36" y="42" font-size="18" text-anchor="middle">🛡️</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Identity Governance</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Okta, SailPoint, midPoint</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(260, 0)">
      <rect width="220" height="72" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#7c3aed" fill-opacity="0.2" />
      <text x="36" y="42" font-size="18" text-anchor="middle">📦</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Data Archiving</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">M365, Google, Druva</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(520, 0)">
      <rect width="220" height="72" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#db2777" fill-opacity="0.2" />
      <text x="36" y="42" font-size="18" text-anchor="middle">⚙️</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">SaaS Offboarding</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">BetterCloud, Torii, Lumos</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(780, 0)">
      <rect width="220" height="72" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <circle cx="36" cy="36" r="18" fill="#059669" fill-opacity="0.2" />
      <text x="36" y="42" font-size="18" text-anchor="middle">🔓</text>
      <text x="68" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Open Source Power</text>
      <text x="68" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#94a3b8">Keycloak, Authentik, SCIM</text>
    </g>
  </g>

  <!-- Border Gradient Stroke -->
  <rect x="1" y="1" width="1198" height="418" rx="15" stroke="url(#textGrad)" stroke-opacity="0.3" stroke-width="1.5" fill="none" />
</svg>
